<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box-sizing</title>
    <style>
        .cb {
            box-sizing: content-box;
            width: 300px;
            height: 150px;
            margin: 10px;
            padding: 30px;
            border: 2px solid green;
        }
        .bb {
            box-sizing: border-box;
            width: 300px;
            height: 150px;
            margin: 10px;
            padding: 30px;
            border: 2px solid green;
        }
    </style>
</head>
<body>
    <div class="cb">
        box-sizing: content-box;
    </div>    
    <div class="bb">
        box-sizing: border-box;
    </div>    
</body>
</html>
