<!DOCTYPE html>

<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>Flex : order</title>
	<style>
		#container {
			width:500px;
			height:300px;
			margin:0 auto;
			display:flex;
			border:2px solid gray;
		}	
		#container div {
			width:200px;
			border: 2px solid #78b4809c;
			background:#78b4804f;
		}
		#box1 {
			order:2;
		}
		#box2 {
			order:3;
		}
		#box3 {
			order:1;
		}
		h2 {
			text-align:center;
			color: rgba(0, 4, 255, 0.521);
		}
		#container h2 {
			font-size:20px;
			font-weight:bold;
			padding:20px;
			color: black;
		}
	</style>
</head>
<body>
	<h2>order</h2>
	<div id="container">
		<div id="box1"><h2><font color="#f00">첫번째</font></h2></div>
		<div id="box2"><h2>두번째</h2></div>
		<div id="box3"><h2>세번째</h2></div>
	</div>
</body>
</html>
