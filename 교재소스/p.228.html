<!DOCTYPE html>

<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>Flex : justify-content</title>
	<style>
		.wrapper {
			width: 500px;
			height: 50px;
			margin: 0 auto 20px;
			display: flex;
			border: 2px solid gray;
		}
		#container1 {
			justify-content:flex-start;
		}
		#container2 {
			justify-content: flex-end;
		}
		#container3 {
			justify-content: center;
		}
		#container4 {
			justify-content: space-between;
		}
		#container5 {
			justify-content: space-around;
		}						
		.wrapper div {
			width:100px;
			border: 2px solid #78b4809c;
			background:#78b4804f;
		}
		h2 {
			text-align:center;
			color: rgba(0, 4, 255, 0.521);
		}
		p {
			font-weight:bold;
			text-align:center;
			font-weight:bold;
		}
	</style>
</head>
<body>
	<h2>justify-content : flex-start</h2>
	<div id="container1" class="wrapper">
		<div><p>첫번째</p></div>
		<div><p>두번째</p></div>
		<div><p>세번째</p></div>
	</div>
	<h2>justify-content : flex-end</h2>
	<div id="container2" class="wrapper">
		<div><p>첫번째</p></div>
		<div><p>두번째</p></div>
		<div><p>세번째</p></div>
	</div>
	<h2>justify-content : center</h2>
	<div id="container3" class="wrapper">
		<div><p>첫번째</p></div>
		<div><p>두번째</p></div>
		<div><p>세번째</p></div>
	</div>
	<h2>justify-content : space-between</h2>
	<div id="container4" class="wrapper">
		<div><p>첫번째</p></div>
		<div><p>두번째</p></div>
		<div><p>세번째</p></div>
	</div>
	<h2>justify-content : space-around</h2>
	<div id="container5" class="wrapper">
		<div><p>첫번째</p></div>
		<div><p>두번째</p></div>
		<div><p>세번째</p></div>
	</div>
</body>
</html>
