<!DOCTYPE html>

<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>Flex : align-items</title>
	<style>
		.wrapper {
			width: 500px;
			height: 100px;
			margin: 0 auto 20px;
			display: flex;
			border: 2px solid gray;
		}
		#container1 {
			align-items: stretch;
		}	
		#container2 {
			align-items:flex-start;
		}
		#container3 {
			align-items: flex-end;
		}
		#container4 {
			align-items: center;
		}
		#container5 {
			align-items: baseline;
		}					
		.wrapper div {
			width:100px;
			border: 2px solid #78b4809c;
			background:#78b4804f;
		}
		h2 {
			text-align:center;
			color: rgba(0, 4, 255, 0.521);
		}
		p {
			font-weight:bold;
			text-align:center;
			font-weight:bold;
		}
	</style>
</head>
<body>
	<h2>align-items : stretch</h2>
	<div id="container1" class="wrapper">
		<div><p>첫번째</p></div>
		<div><p>두번째</p></div>
		<div><p>세번째</p></div>
	</div>
	<h2>align-items : flex-start</h2>
	<div id="container2" class="wrapper">
		<div><p>첫번째</p></div>
		<div><p>두번째</p></div>
		<div><p>세번째</p></div>
	</div>
	<h2>align-items : flex-end</h2>
	<div id="container3" class="wrapper">
		<div><p>첫번째</p></div>
		<div><p>두번째</p></div>
		<div><p>세번째</p></div>
	</div>
	<h2>align-items : center</h2>
	<div id="container4" class="wrapper">
		<div><p>첫번째</p></div>
		<div><p>두번째</p></div>
		<div><p>세번째</p></div>
	</div>
	<h2>align-items : baseline</h2>
	<div id="container5" class="wrapper">
		<div><p style="font-size:10px">첫번째</p></div>
		<div><p style="font-size:20px">두번째</p></div>
		<div><p style="font-size:15px">세번째</p></div>
	</div>
</body>
</html>
