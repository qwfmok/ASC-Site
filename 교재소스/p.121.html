<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>CSS3</title>
    <style>
        #introduction {
            width: 500px;
            padding: 15px;
            border: 5px solid gray;
        }
        h1, h3 {
            color: blue;
            text-align: left;
        }
        p {
            font-size: 0.9em;
            line-height: 2.0;
        }
        .greentext {
            color: green;
            font-size: 1.1em;
            font-weight: bold;
        }
        .align{
            text-align: left
        }
    </style>
</head>
<body>
    <div id="introduction">
        <h1>
            HTML5
        </h1>
        <p>
            저는 웹퍼블리싱에 관심이 있고<br>
            현재 HTML5 와 CSS3 에 대해서 열심히 공부하고 있습니다.
        </p>
        <p class="greentext align">
            HTML5 를 마치고 지금은<br>
            CSS3 를 공부하고 있습니다.
        </p>
    </div>
</body>
</html>
