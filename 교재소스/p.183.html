<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <style>
        div{
            width: 200px;
            height: 100px;
            padding: 20px;
        }
        #parent{
            border: 1px solid gray;
            width: 500px;
            height: 300px;
            background: rgba(223, 222, 222, 0.76);
            position: relative;
        }
        #topleft{
            border: 1px solid gray;
            background: rgba(90, 131, 48, 0.452);
            position: absolute;
            left: 0px;
            top: 0px;
        }
        #topright{
            border: 1px solid gray;
            background: rgb(192, 192, 19);
            position: absolute;
            right: 0px;
            top: 0px;
        }
        #bottomleft{
            border: 1px solid gray;
            background: rgba(255, 0, 0, 0.493);
            position: absolute;
            left: 0px;
            bottom: 0px;
        }
        #bottomright{
            border: 1px solid gray;
            background: rgba(0, 0, 255, 0.425);
            position: absolute;
            right: 0px;
            bottom: 0px;
        }
        #abs{
            border: 1px solid gray;
            width: 100px;
            height: 100px;
            background: rgba(72, 72, 78, 0.884);
            position: absolute;
            left: 200px;
            top: 100px;
        }

    </style>
</head>
<body>
    <div id="parent">
        <div id="topleft">박스1</div>
        <div id="topright">박스2</div>
        <div id="bottomleft">박스3</div>
        <div id="bottomright">박스4</div>
        <div id="abs">박스5</div>
    </div>
</body>
</html>
