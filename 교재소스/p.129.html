<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>명시도</title>
    <style>
        p {
            color: blue;
        }
    </style>
</head>
<body>
    <p>
        body 태그에 의해 모든 본문은 파란색으로<br>
        적용하게 되어있지만<br>
        <span style="color: red;">span 으로 둘러싸인<br>
        이 문장은 빨간색으로 표시됩니다.</span><br>
        그 이유는 h2 에 적용된 스타일인 color:red; 가<br>
        선언되면서 기존의 스타일을 대체하였기 때문입니다. 
    </p>
</body>
</html>
