<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>텍스트 그림자</title>
    <style>
        h1 {
            color: orange;
            font-size: 100px; /* 글꼴 크기 */
            font-family: "Arial Rounded MT"; /* 글꼴 */
        }
        .shadow1 {
            text-shadow: 5px 5px gray; /* 텍스트 그림자 */
        }
        .shadow2 {
            text-shadow: 5px 5px 7px #f00; /* 텍스트 그림자 */
        }
        .shadow3 {
            text-shadow: 7px -7px 10px #00f; /* 텍스트 그림자 */
        }
    </style>
</head>
<body>
    <h1 class="shadow1">CSS3</h1>
    <h1 class="shadow2">CSS3</h1>
    <h1 class="shadow3">CSS3</h1>
</body>
</html>
