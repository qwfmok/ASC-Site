<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <style>
        div{
            box-sizing: border-box;
            border: 1px solid gray;
        }
        #box1{
            width: 200px;
            height: 100px;
            background-color: yellow;
            padding: 30px 70px;
            float: left;
        }
        #box2{
            width: 200px;
            height: 100px;
            background-color: rgba(0, 128, 0, 0.308);
            padding: 30px 70px;
            float: left;
            position: relative;
            left: -30px;
            top: 30px;
        }



    </style>
</head>
<body>
    <div id="box1">박스1</div>
    <div id="box2">박스2</div>
</body>
</html>
