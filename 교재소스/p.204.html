<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .wrapper{
            width: 100%;
            margin: 0 auto;
        }
        .header{
            width: 100%;
            background-color: rgba(0, 0, 255, 0.062);
            height: 40px;
        }
        .content{
            width: 73%;
            background-color: rgba(0, 128, 0, 0.151);
            height: 300px;
            float: left;
        }
        .side{
            width: 27%;
            background-color: rgba(0, 128, 0, 0.384);
            height: 300px;
            float: right;
        }
        .footer{
            width: 100%;
            background-color: rgba(0, 128, 0, 0.192);
            height: 30px;
            clear: both;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="header">Header</div>
        <div class="content">Content</div>
        <div class="side">Side</div>
        <div class="footer">Footer</div>
    </div>
</body>
</html>
