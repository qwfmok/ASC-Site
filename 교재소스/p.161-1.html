<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
    <style>
        .outer {
            border: 1px solid gray;
            padding: 10px;
            background-color: #d3cec2;
        }
        .inner {
            display: inline;
            width: 100px;
            height: 100px;
            border: 1px solid gray;
            background-color: yellow;
        }
        .inner1 {
            padding: 10px;
            margin: 10px;
            border-top: 2px solid red; /* 상단 테두리의 두께는 2픽셀 색상은 빨강 스타일은 실선 */
            border-right: dashed 1px blue; /* 우측 테두리의 스타일은 파선 두께는 1픽셀 색상은 파랑 */
            border-bottom: dotted 3px green; /* 하단 테두리의 스타일은 점선 두께는 3픽셀 색상은 초록 */
            border-left: groove 20px orange; /* 좌측 테두리의 스타일은 홈 형태 두께는 2픽셀 색상은 주황 */
            
            /* 모든 방향에 동일한 테두리 스타일 적용 */
            /* border: 1px solid black; */ /* 테두리의 두께는 1픽셀 색상은 검정 스타일은 실선 */
        }

        .inner2 {
            border-top-left-radius: 10px; /* 상단 좌측 모서리의 반지름은 10픽셀 */
            border-top-right-radius: 20%; /* 상단 우측 모서리의 반지름은 상위 요소의 가로 길이의 20% */
            border-bottom-left-radius: 20px; /* 하단 좌측 모서리의 반지름은 20픽셀 */
            border-bottom-right-radius: 50%; /* 하단 우측 모서리의 반지름은 상위 요소의 세로 길이의 50% */
            
            /* 모든 모서리에 동일한 반지름 적용 */
            border-radius: 10px; /* 모든 모서리의 반지름은 10픽셀 */
        }

    </style>
</head>
<body>
    <div class="outer">
        <div class="inner">첫번째 &lt;div&gt;</div>
        <div class="inner">두번째 &lt;div&gt;</div>
        <div class="inner">세번째 &lt;div&gt;</div>
    </div>
</body>
</html>
